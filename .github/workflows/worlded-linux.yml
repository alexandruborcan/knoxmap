name: worlded-linux

# A native Linux build of the patched map compiler, so Linux does not need
# Wine to make a map.
#
# Wine works, but it is a layer nobody can see into: WorldEd dies and there is
# nothing to read, its pipes are held open by wineserver long after it is
# gone, and paths have to be handed over as Z: names. Upstream publishes
# Windows binaries only, and its own BUILDING.md calls the Linux flow
# "intended" rather than tested - so this builds it, runs it, and packages it
# with the Qt libraries it needs, because none of that can be taken on trust.

on:
  workflow_dispatch:
  push:
    paths:
      - 'worlded/**'
      - '.github/workflows/worlded-linux.yml'

env:
  # The release knoxmap_setup.py pins, and the commit worlded/README.md names.
  COMMIT: 4e86b80c505b3d77a2fb5f5675b752da966306f6

jobs:
  build:
    name: Build PZWorldEd_cli for Linux
    # The oldest runner still offered: a binary built against a newer glibc
    # will not start on a distro older than the one that built it.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Qt 5.15 and a compiler
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential patchelf \
            qtbase5-dev qtbase5-dev-tools qttools5-dev qttools5-dev-tools \
            libqt5svg5-dev libqt5opengl5-dev libqt5x11extras5-dev \
            zlib1g-dev
          qmake -v

      - name: PZ Mapping Tools at the pinned commit
        run: |
          git clone --quiet https://github.com/Unjammer/PZ_Mapping_Tools.git src
          git -C src checkout --quiet "$COMMIT"
          git -C src log --oneline -1

      - name: KnoxMap's headless patch
        run: python3 worlded/patch_worlded_cli.py src

      - name: And what GCC will not build as it stands
        run: python3 worlded/patch_worlded_linux.py src

      - name: Build
        run: |
          mkdir -p build
          cd build
          qmake "$GITHUB_WORKSPACE/src/WorldEd/PZWorldEd.pro" CONFIG+=release
          make -j"$(nproc)"

      - name: Find what was built
        id: built
        run: |
          exe=$(find build -type f -name PZWorldEd -perm -u+x | head -1)
          test -n "$exe" || { echo "no PZWorldEd came out of the build"; exit 1; }
          file "$exe"
          file "$exe" | grep -q 'ELF 64-bit.*executable' ||
            { echo "not a 64-bit Linux executable"; exit 1; }
          echo "exe=$exe" >> "$GITHUB_OUTPUT"

      - name: It carries the headless switch
        run: |
          strings "${{ steps.built.outputs.exe }}" | grep -q -- '--generate-map' ||
            { echo "the patch did not make it into the binary"; exit 1; }

      - name: Package it with its libraries
        run: |
          exe='${{ steps.built.outputs.exe }}'
          out=pack/PZWorldEd_cli-linux-x86_64
          mkdir -p "$out/lib" "$out/plugins/platforms"
          cp "$exe" "$out/PZWorldEd_cli"
          # WorldEd's own libraries first: libworlded, libtiled and the rest
          # come out of the build, not from anywhere on the system. Symlinks
          # and all - libzlib1.so.1.0.0 is the file, and libzlib1.so.1 is the
          # name the program asks for.
          find build -name '*.so*' -exec cp -av {} "$out/lib/" \;
          ls -l "$out/lib" | head -40
          # Headless: the compile draws nothing, so the offscreen plugin is
          # all Qt needs and no X libraries come into it.
          for plugin in libqoffscreen.so libqminimal.so; do
            found=$(find /usr/lib -name "$plugin" | head -1)
            [ -n "$found" ] && cp -Lv "$found" "$out/plugins/platforms/"
          done
          # Then everything any of that needs which is not the base system or
          # the machine's own graphics stack - Qt above all, so it runs on a
          # PC with no Qt installed. Three rounds, because a library copied in
          # brings its own.
          system='/(ld-linux[^/]*|libc|libm|libdl|libpthread|librt|libstdc\+\+|libgcc_s|libGL|libGLX|libGLdispatch|libEGL|libOpenGL|libX11|libxcb|libdrm|libgbm|libwayland-[a-z]+)[.-]'
          for round in 1 2 3; do
            for f in "$out/PZWorldEd_cli" "$out"/lib/*.so* "$out"/plugins/platforms/*.so; do
              [ -e "$f" ] || continue
              LD_LIBRARY_PATH="$PWD/$out/lib" ldd "$f" 2>/dev/null |
                awk '/=> \//{print $3}' | grep -vE "$system"
            done | sort -u | while read -r lib; do
              [ -e "$out/lib/$(basename "$lib")" ] || cp -Lv "$lib" "$out/lib/"
            done
          done
          # Found beside the program rather than wherever a distro keeps it.
          patchelf --set-rpath '$ORIGIN/lib' "$out/PZWorldEd_cli"
          for lib in "$out"/lib/*.so*; do patchelf --set-rpath '$ORIGIN' "$lib"; done
          for plugin in "$out"/plugins/platforms/*.so; do
            patchelf --set-rpath '$ORIGIN/../../lib' "$plugin"
          done
          du -sh "$out"

      - name: Nothing it needs is missing
        run: |
          out=pack/PZWorldEd_cli-linux-x86_64
          missing=$( { ldd "$out/PZWorldEd_cli"; ldd "$out"/plugins/platforms/*.so; } |
                     grep 'not found' || true)
          [ -z "$missing" ] || { echo "$missing"; exit 1; }
          echo "every library resolves"

      - name: It runs
        run: |
          out=pack/PZWorldEd_cli-linux-x86_64
          export QT_QPA_PLATFORM=offscreen
          export QT_QPA_PLATFORM_PLUGIN_PATH="$PWD/$out/plugins/platforms"
          # With no game folder configured it stops at its own first-run setup
          # dialog and waits there, so it is started, read and closed. What is
          # being checked is that the binary loads and WorldEd's own code runs:
          # a whole compile needs the artwork out of a copy of the game, which
          # is not here and is never redistributed.
          set +e
          timeout 60 "./$out/PZWorldEd_cli" --generate-map=/nonexistent.pzw > run.log 2>&1
          code=$?
          set -e
          cat run.log
          echo "exit $code"
          [ "$code" != 127 ] || { echo "it never loaded"; exit 1; }
          [ "$code" -lt 128 ] || { echo "killed by a signal - it did not start cleanly"; exit 1; }
          grep -q 'Runtime: Qt' run.log ||
            { echo "it never reached its own startup"; exit 1; }
          grep -q 'Application Build' run.log ||
            { echo "no build banner - this is not WorldEd running"; exit 1; }
          echo "ok: the native build loads and runs WorldEd's own code"

      - name: Tarball
        run: |
          cd pack
          tar czf PZWorldEd_cli-linux-x86_64.tar.gz PZWorldEd_cli-linux-x86_64
          sha256sum PZWorldEd_cli-linux-x86_64.tar.gz | tee SHA256

      - uses: actions/upload-artifact@v4
        with:
          name: PZWorldEd_cli-linux-x86_64
          path: |
            pack/PZWorldEd_cli-linux-x86_64.tar.gz
            pack/SHA256
          if-no-files-found: error
