name: launcher

# KnoxMap.exe: built with mingw-w64 on Linux, then actually run on Windows.
#
# The launcher is the first thing a player touches, and it cannot be tested
# on the machine it is written on, so it is built and exercised here: a folder
# that has no environment yet must run Setup, and one that has must start
# the window and get out of the way.
on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:

jobs:
  build:
    name: Build KnoxMap.exe
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: mingw-w64
        run: sudo apt-get update -qq && sudo apt-get install -y -qq
             gcc-mingw-w64-x86-64 binutils-mingw-w64-x86-64

      - name: Build
        run: |
          chmod +x win/build_launcher.sh
          win/build_launcher.sh
          file KnoxMap.exe
          file KnoxMap.exe | grep -qE 'PE32\+ executable \(GUI\) x86-64' ||
            { echo "not a windowed 64-bit exe"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: KnoxMap-exe
          path: KnoxMap.exe
          if-no-files-found: error

  run_it:
    name: Run it on Windows
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: KnoxMap-exe

      - name: It runs Setup when there is no environment yet
        shell: pwsh
        run: |
          $python = (Get-Command python).Source
          $box = Join-Path $env:RUNNER_TEMP 'first-run'
          New-Item -ItemType Directory -Force $box | Out-Null
          Copy-Item KnoxMap.exe $box
          # A stand-in for Setup.bat: it leaves the environment the launcher
          # is looking for, and a mark to say it ran.
          @"
          @echo off
          echo setup ran > "%~dp0setup-ran.txt"
          mkdir "%~dp0.venv\Scripts" 2>nul
          copy /y "$python" "%~dp0.venv\Scripts\pythonw.exe" >nul
          exit /b 0
          "@ | Set-Content -Encoding ascii (Join-Path $box 'Setup.bat')
          "open('started.txt','w').write('started')" |
            Set-Content -Encoding ascii (Join-Path $box 'knoxmap.py')
          Push-Location $box
          & .\KnoxMap.exe
          Start-Sleep -Seconds 10
          Pop-Location
          if (-not (Test-Path (Join-Path $box 'setup-ran.txt'))) {
            throw 'the launcher did not run Setup.bat'
          }
          if (-not (Test-Path (Join-Path $box '.venv\Scripts\pythonw.exe'))) {
            throw 'setup did not leave an environment behind'
          }
          if (-not (Test-Path (Join-Path $box 'started.txt'))) {
            throw 'the launcher ran Setup but never started the window'
          }
          Write-Host 'ok: no environment -> Setup ran, then the window started'

      - name: It starts the window and exits without holding the file
        shell: pwsh
        run: |
          $python = (Get-Command python).Source
          $box = Join-Path $env:RUNNER_TEMP 'normal-run'
          New-Item -ItemType Directory -Force (Join-Path $box '.venv\Scripts') | Out-Null
          Copy-Item KnoxMap.exe $box
          # The real thing: pythonw.exe running knoxmap.py, which here only
          # writes a file and ends.
          Copy-Item $python (Join-Path $box '.venv\Scripts\pythonw.exe')
          "open('started.txt','w').write('started')" |
            Set-Content -Encoding ascii (Join-Path $box 'knoxmap.py')
          Push-Location $box
          $started = Get-Date
          & .\KnoxMap.exe
          $took = (Get-Date) - $started
          Start-Sleep -Seconds 10
          Pop-Location
          if (-not (Test-Path (Join-Path $box 'started.txt'))) {
            throw 'the launcher did not start pythonw.exe with knoxmap.py'
          }
          if ($took.TotalSeconds -gt 5) {
            throw "the launcher waited $($took.TotalSeconds)s instead of exiting"
          }
          # It must not hold its own file open, or an update cannot replace it.
          Set-Content -Path (Join-Path $box 'KnoxMap.exe') -Value 'replaced' -Force
          Write-Host 'ok: started the window, exited, and can be updated over'

